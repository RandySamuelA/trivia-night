    <path d="M -155,-35 L -60,-35 L -60,-75 L 60,-75 L 60,-35 L 155,-35 L 135,35 L 60,35 L 60,75 L -60,75 L -60,35 L -135,35 Z" fill="url(#silverGrad)"/>
    <!-- Inner gold body -->
